general {
    hide_cursor = 2
    grace = 1
    disable_loading_bar = true
}

background {
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

input-field {
    size = 200, 50
    outline_thickness = 2
    outer_color = rgba(89b4faaa)
    inner_color = rgba(30, 30, 46, 0.9)
    font_color = rgb(cdd6f4)
    placeholder_text = Mot de passe...
    fail_color = rgba(f38ba8aa)
    check_color = rgba(a6e3a1aa)
    font_family = JetBrainsMono Nerd Font
    position = 0, -120
    halign = center
}

label {
    color = rgb(cdd6f4)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -200
    halign = center
}

image {
    position = 0, -280
    halign = center
    path = ~/.config/hypr/icon.png
}

font {
    color = rgb(cdd6f4)
    font = JetBrainsMono Nerd Font
    size = 12
}

text {
    position = 30, -30
    halign = left
    font_size = 11
    color = rgb(a6adc8)
}

general {
    no_fade_in = false
    no_fade_out = false
}
